<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrameUs | Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Deva:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary-pink: #ff8ba3;
  --accent-pink: #ff5d82;
  --soft-bg: #fcf7f4;
  --border-pink: #e88ca2;
  --text-tone: #69414c;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: "Playpen Sans Deva", sans-serif;
  color: var(--text-tone);
  background:
    radial-gradient(1200px 700px at 10% 5%, rgba(255, 139, 163, 0.35) 0%, rgba(255, 139, 163, 0) 60%),
    radial-gradient(900px 500px at 90% 90%, rgba(255, 93, 130, 0.22) 0%, rgba(255, 93, 130, 0) 58%),
    linear-gradient(145deg, #fffaf7 0%, var(--soft-bg) 45%, #f9eff0 100%);
  display: grid;
  place-items: center;
  min-height: 100dvh;
  padding: clamp(10px, 2vh, 20px);
  overflow: hidden;
}

.stage {
  width: min(760px, 100%);
  height: 100dvh;
  display: grid;
  place-items: center;
}

.booth {
  position: relative;
  width: 100%;
  max-height: calc(100dvh - 24px);
  border-radius: 30px;
  border: 1px solid rgba(232, 140, 162, 0.45);
  background: rgba(255, 255, 255, 0.44);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow:
    0 26px 60px rgba(132, 70, 86, 0.16),
    0 8px 24px rgba(255, 139, 163, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.7);
  padding: clamp(10px, 2vw, 18px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.camera-wrap {
  position: relative;
  width: min(100%, calc((100dvh - 205px) * 0.75));
  max-height: calc(100dvh - 205px);
  border-radius: 22px;
  overflow: hidden;
  border: 2px solid rgba(232, 140, 162, 0.5);
  background: #f8e9ed;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
  aspect-ratio: 3 / 4;
  margin: 0 auto;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: linear-gradient(180deg, #f4dce3 0%, #f0c8d3 100%);
}

.overlay-text {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

#statusText {
  top: 20px;
  font-size: clamp(14px, 2vw, 18px);
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.78);
  color: var(--text-tone);
  font-weight: 600;
  opacity: 0;
  transition: opacity 220ms ease;
}

#statusText.show {
  opacity: 1;
}

#countdown {
  left: 50%;
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  width: clamp(84px, 12vw, 124px);
  height: clamp(84px, 12vw, 124px);
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-size: clamp(44px, 7vw, 82px);
  font-weight: 700;
  line-height: 1;
  color: var(--white);
  letter-spacing: -0.02em;
  text-shadow: 0 2px 10px rgba(255, 255, 255, 0.45), 0 8px 22px rgba(0, 0, 0, 0.26);
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.34) 8%, rgba(255, 139, 163, 0.28) 52%, rgba(255, 93, 130, 0.34) 100%);
  border: 1px solid rgba(255, 255, 255, 0.62);
  backdrop-filter: blur(10px) saturate(120%);
  -webkit-backdrop-filter: blur(10px) saturate(120%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.75),
    inset 0 -10px 18px rgba(255, 93, 130, 0.14),
    0 10px 30px rgba(61, 29, 41, 0.3),
    0 0 26px rgba(255, 139, 163, 0.34);
  opacity: 0;
  scale: 1;
  pointer-events: none;
  isolation: isolate;
  will-change: opacity, scale;
}

#countdown.show {
  opacity: 1;
  animation: countdownPulse 0.9s cubic-bezier(.21, .78, .18, 1) both;
}

#countdown::before {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: inherit;
  border: 2px solid rgba(232, 140, 162, 0.55);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.22),
    0 0 18px rgba(255, 139, 163, 0.44),
    0 0 34px rgba(255, 93, 130, 0.3);
  opacity: 0;
  scale: 0.94;
  z-index: -1;
}

#countdown.show::before {
  animation: glowRing 0.9s cubic-bezier(.21, .78, .18, 1) both;
}

#countdown::after {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: inherit;
  background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.08) 36%, rgba(255, 255, 255, 0) 70%);
  pointer-events: none;
}

.flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at center, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.9) 35%, rgba(255, 255, 255, 0.3) 70%, rgba(255, 255, 255, 0) 100%);
  opacity: 0;
}

.flash.active {
  animation: shutterFlash 430ms ease-out;
}

.control {
  display: grid;
  place-items: center;
  margin-top: clamp(10px, 1.8vh, 18px);
  gap: 12px;
}

#startBtn {
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--primary-pink), var(--accent-pink));
  color: var(--white);
  font-family: inherit;
  font-size: clamp(15px, 2.2vw, 18px);
  font-weight: 700;
  letter-spacing: 0.2px;
  padding: 13px 26px;
  min-width: 180px;
  cursor: pointer;
  box-shadow: 0 12px 26px rgba(255, 93, 130, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

#startBtn:hover:not(:disabled) {
  transform: translateY(-1px) scale(1.02);
  box-shadow: 0 16px 30px rgba(255, 93, 130, 0.44);
}

#startBtn:disabled {
  cursor: not-allowed;
  opacity: 0.68;
  box-shadow: none;
}

#loading {
  font-size: 14px;
  color: var(--text-tone);
  display: none;
  align-items: center;
  gap: 8px;
}

#loading.show {
  display: inline-flex;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: var(--accent-pink);
  animation: bounceDot 900ms infinite ease-in-out;
}

.dot:nth-child(2) {
  animation-delay: 120ms;
}

.dot:nth-child(3) {
  animation-delay: 240ms;
}

@keyframes countdownPulse {
  0% {
    scale: 0.55;
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  60% {
    scale: 1;
    opacity: 1;
  }
  100% {
    scale: 1.12;
    opacity: 0.96;
  }
}

@keyframes glowRing {
  0% {
    opacity: 0.08;
    scale: 0.9;
  }
  45% {
    opacity: 0.7;
    scale: 1;
  }
  100% {
    opacity: 0.2;
    scale: 1.12;
  }
}

@keyframes shutterFlash {
  0% {
    opacity: 0;
  }
  22% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

@keyframes bounceDot {
  0%,
  80%,
  100% {
    transform: translateY(0);
    opacity: 0.5;
  }
  40% {
    transform: translateY(-6px);
    opacity: 1;
  }
}

@media (max-width: 699px) {
  .booth {
    border-radius: 22px;
    max-height: calc(100dvh - 18px);
  }

  .camera-wrap {
    border-radius: 16px;
    width: min(100%, calc((100dvh - 185px) * 0.75));
    max-height: calc(100dvh - 185px);
  }

  #countdown {
    width: 90px;
    height: 90px;
  }

  .control {
    margin-top: 10px;
  }

  #startBtn {
    width: 100%;
    max-width: 260px;
  }
}

@media (min-width: 700px) and (max-width: 1024px) {
  .stage {
    width: min(680px, 92vw);
  }
}

@media (min-width: 1025px) {
  .stage {
    width: min(760px, 80vw);
  }
}

@media (max-height: 700px) {
  .camera-wrap {
    width: min(100%, calc((100dvh - 170px) * 0.75));
    max-height: calc(100dvh - 170px);
  }

  #countdown {
    width: 84px;
    height: 84px;
  }

  .control {
    gap: 8px;
  }

  #startBtn {
    padding: 10px 22px;
  }
}
</style>
</head>
<body>
<div class="stage">
  <div class="booth">
    <div class="camera-wrap">
      <video id="camera" autoplay playsinline muted></video>
      <div id="statusText" class="overlay-text"></div>
      <div id="countdown" class="overlay-text" aria-live="polite"></div>
      <div id="flash" class="flash" aria-hidden="true"></div>
    </div>

    <div class="control">
      <button id="startBtn" type="button" disabled>Initializing Camera...</button>
      <div id="loading" aria-live="polite">
        <span>Preparing your photo strip...</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>
<audio id="shutter" src="shutter.mp3" preload="auto"></audio>

<script>
const TOTAL_SHOTS = 4;
const SHOT_DELAY_MS = 850;
const REDIRECT_DELAY_MS = 420;
const MAX_CAPTURE_WIDTH = 960;
const JPEG_QUALITY = 0.72;

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const countdown = document.getElementById("countdown");
const flash = document.getElementById("flash");
const shutter = document.getElementById("shutter");
const startBtn = document.getElementById("startBtn");
const statusText = document.getElementById("statusText");
const loading = document.getElementById("loading");

let streamRef = null;
let isStreamReady = false;
let isCapturing = false;
let captureSessionId = 0;

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function showStatus(message) {
  if (!message) {
    statusText.textContent = "";
    statusText.classList.remove("show");
    return;
  }

  statusText.textContent = message;
  statusText.classList.add("show");
}

function setButtonState(label, disabled) {
  startBtn.textContent = label;
  startBtn.disabled = disabled;
}

async function waitForVideoReady(videoEl) {
  if (videoEl.readyState >= 2 && videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
    return;
  }

  await new Promise((resolve, reject) => {
    const timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error("Timed out waiting for video metadata."));
    }, 10000);

    const onLoaded = () => {
      if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
        cleanup();
        resolve();
      }
    };

    const onError = () => {
      cleanup();
      reject(new Error("Video element failed to load metadata."));
    };

    const cleanup = () => {
      clearTimeout(timeoutId);
      videoEl.removeEventListener("loadedmetadata", onLoaded);
      videoEl.removeEventListener("canplay", onLoaded);
      videoEl.removeEventListener("error", onError);
    };

    videoEl.addEventListener("loadedmetadata", onLoaded);
    videoEl.addEventListener("canplay", onLoaded);
    videoEl.addEventListener("error", onError);
  });
}

async function startCamera() {
  try {
    setButtonState("Initializing Camera...", true);
    showStatus("Requesting camera access...");

    streamRef = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "user" },
        width: { ideal: 1080 },
        height: { ideal: 1440 }
      },
      audio: false
    });

    video.srcObject = streamRef;
    await video.play();
    await waitForVideoReady(video);

    isStreamReady = true;
    showStatus("");
    setButtonState("Start Booth", false);
  } catch (error) {
    console.error("Camera setup failed:", error);
    isStreamReady = false;
    setButtonState("Camera Access Needed", true);

    const denied = error && (error.name === "NotAllowedError" || error.name === "SecurityError");
    const noCam = error && error.name === "NotFoundError";

    if (denied) {
      showStatus("Camera permission denied");
      alert("Please allow camera permission to use FrameUs booth.");
      return;
    }

    if (noCam) {
      showStatus("No camera found");
      alert("No camera device was found on this device.");
      return;
    }

    showStatus("Unable to start camera");
    alert("Could not start the camera. Please refresh and try again.");
  }
}

function unlockShutterAudio() {
  shutter.currentTime = 0;
  shutter.play().then(() => {
    shutter.pause();
    shutter.currentTime = 0;
  }).catch(() => {
    // Audio unlock can fail silently on some browsers before user interaction.
  });
}

function runCountdownStep(value) {
  countdown.textContent = value > 0 ? String(value) : "";
  if (value > 0) {
    countdown.classList.remove("show");
    void countdown.offsetWidth;
    countdown.classList.add("show");
  } else {
    countdown.classList.remove("show");
  }
}

async function countdownFromThree(sessionId) {
  for (let value = 3; value >= 1; value -= 1) {
    if (!isCapturing || sessionId !== captureSessionId) {
      return false;
    }

    runCountdownStep(value);
    await sleep(1000);
  }

  runCountdownStep(0);
  return true;
}

function triggerFlash() {
  flash.classList.remove("active");
  void flash.offsetWidth;
  flash.classList.add("active");
}

function playShutter() {
  shutter.currentTime = 0;
  shutter.play().catch(() => {
    // Ignore playback rejection and continue capture.
  });
}

function captureFrame() {
  if (!isStreamReady || video.videoWidth === 0 || video.videoHeight === 0) {
    throw new Error("Capture attempted before camera stream was ready.");
  }

  const ctx = canvas.getContext("2d", { alpha: false });
  const sourceWidth = video.videoWidth;
  const sourceHeight = video.videoHeight;
  const scale = sourceWidth > MAX_CAPTURE_WIDTH ? MAX_CAPTURE_WIDTH / sourceWidth : 1;

  canvas.width = Math.round(sourceWidth * scale);
  canvas.height = Math.round(sourceHeight * scale);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // JPEG is much smaller than PNG for camera photos, which improves storage reliability and load speed.
  const jpegData = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
  if (jpegData && jpegData.startsWith("data:image/jpeg")) {
    return jpegData;
  }

  return canvas.toDataURL("image/jpeg", 0.7);
}

function stopCameraStream() {
  if (!streamRef) {
    return;
  }

  streamRef.getTracks().forEach((track) => {
    try {
      track.stop();
    } catch (error) {
      console.error("Failed to stop camera track:", error);
    }
  });

  streamRef = null;
  video.srcObject = null;
  isStreamReady = false;
}

function storePhotosWithFallback(photos) {
  const payload = JSON.stringify(photos);

  try {
    localStorage.setItem("boothPhotos", payload);
    const localReadback = localStorage.getItem("boothPhotos");
    if (localReadback === payload) {
      return "localStorage";
    }
  } catch (error) {
    console.error("localStorage failed:", error);
  }

  try {
    sessionStorage.setItem("boothPhotos", payload);
    const sessionReadback = sessionStorage.getItem("boothPhotos");
    if (sessionReadback === payload) {
      return "sessionStorage";
    }
  } catch (error) {
    console.error("sessionStorage failed:", error);
  }

  return null;
}

function safeRedirectToResults() {
  try {
    window.location.assign("result.html");

    setTimeout(() => {
      if (document.visibilityState === "visible") {
        console.error("Primary redirect did not complete in time, retrying with replace.");
        try {
          window.location.replace("result.html");
        } catch (retryError) {
          console.error("Redirect retry failed:", retryError);
        }
      }
    }, 1500);
  } catch (error) {
    console.error("Redirect failed:", error);
    alert("Photos are saved, but redirect failed. Please open result.html manually.");
  }
}

async function runCaptureSequence() {
  const sessionId = ++captureSessionId;
  let photos = [];

  isCapturing = true;
  loading.classList.remove("show");
  setButtonState("Capturing...", true);
  showStatus("Get Ready...");

  await sleep(900);

  for (let i = 0; i < TOTAL_SHOTS; i += 1) {
    if (!isCapturing || sessionId !== captureSessionId) {
      return;
    }

    showStatus(`Photo ${i + 1} of ${TOTAL_SHOTS}`);

    const countdownOk = await countdownFromThree(sessionId);
    if (!countdownOk) {
      return;
    }

    triggerFlash();
    playShutter();

    try {
      photos.push(captureFrame());
    } catch (error) {
      console.error("Capture failed:", error);
      alert("Capture failed. Please try again.");
      isCapturing = false;
      setButtonState("Start Booth", false);
      showStatus("Capture error");
      return;
    }

    await sleep(SHOT_DELAY_MS);
  }

  showStatus("Almost done...");
  loading.classList.add("show");
  stopCameraStream();

  const storageUsed = storePhotosWithFallback(photos);
  if (!storageUsed) {
    loading.classList.remove("show");
    isCapturing = false;
    setButtonState("Start Booth", false);
    showStatus("Storage failed");
    alert("Unable to save photos on this browser. Please free storage and try again.");
    return;
  }

  console.info(`Saved ${photos.length} photos to ${storageUsed}. Redirecting...`);

  await sleep(REDIRECT_DELAY_MS);
  safeRedirectToResults();
}

startBtn.addEventListener("click", async () => {
  if (isCapturing) {
    return;
  }

  if (!isStreamReady) {
    alert("Camera is not ready yet. Please wait a moment and try again.");
    return;
  }

  unlockShutterAudio();
  await runCaptureSequence();
});

window.addEventListener("beforeunload", () => {
  if (!isCapturing) {
    stopCameraStream();
  }
});

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  alert("Your browser does not support camera access. Please use a modern browser.");
  setButtonState("Unsupported Browser", true);
  showStatus("Camera unsupported");
} else {
  startCamera();
}
</script>
</body>
</html>
